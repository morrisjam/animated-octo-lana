name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration compatibility check
        run: npm run api:migrations:compat

      - name: Unit tests
        run: npm run test

      - name: Replay checksum check
        run: npm run replay:check

      - name: Build
        run: npm run build
