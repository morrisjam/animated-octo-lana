name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration compatibility check
        run: npm run api:migrations:compat

      - name: Unit tests
        run: npm run test

      - name: Replay checksum check
        run: npm run replay:check

      - name: Build
        run: npm run build

  steam-package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, package, and smoke-test Steam profile
        run: npm run steam:ci
        env:
          STEAM_ARTIFACT_SIGNING_KEY: ${{ secrets.STEAM_ARTIFACT_SIGNING_KEY }}
          STEAM_ARTIFACT_SIGNING_PUBLIC_KEY: ${{ secrets.STEAM_ARTIFACT_SIGNING_PUBLIC_KEY }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}

      - name: Archive Steam upload artifact
        run: |
          mkdir -p steam-artifacts
          tar -czf steam-artifacts/gravity-well-steam-${{ github.sha }}.tar.gz -C apps/game-web/steam-artifact .

      - name: Upload Steam artifact
        uses: actions/upload-artifact@v6
        with:
          name: steam-package-${{ github.sha }}
          path: steam-artifacts/gravity-well-steam-${{ github.sha }}.tar.gz
