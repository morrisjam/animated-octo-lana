<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020715"/>
      <stop offset="0.52" stop-color="#11133d"/>
      <stop offset="1" stop-color="#05071c"/>
    </linearGradient>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#655cff" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#6325ae" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#120b34" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop offset="0" stop-color="#44d7ff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#157dba" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#061329" stop-opacity="0"/>
    </radialGradient>
    <filter id="cloud" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.024" numOctaves="3" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="54"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1024" height="512" fill="url(#sky)"/>
  <ellipse cx="330" cy="245" rx="410" ry="190" fill="url(#violet)" filter="url(#cloud)" transform="rotate(-12 330 245)"/>
  <ellipse cx="760" cy="220" rx="350" ry="135" fill="url(#cyan)" filter="url(#cloud)" transform="rotate(16 760 220)"/>
  <g fill="#d7f3ff">
    <circle cx="84" cy="78" r="1.3"/><circle cx="181" cy="377" r="0.9"/><circle cx="296" cy="104" r="1.1"/>
    <circle cx="438" cy="411" r="1.5"/><circle cx="568" cy="82" r="0.8"/><circle cx="685" cy="352" r="1.2"/>
    <circle cx="812" cy="119" r="1.4"/><circle cx="945" cy="402" r="0.9"/><circle cx="985" cy="205" r="1.1"/>
  </g>
</svg>
