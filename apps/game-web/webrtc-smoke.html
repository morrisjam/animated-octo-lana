<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Gravity Well WebRTC Smoke</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050814; color: #dce8ff; }
      main { width: min(760px, calc(100vw - 32px)); }
      h1 { font: 700 28px/1.1 Georgia, serif; letter-spacing: .02em; }
      p { color: #9eb0cd; line-height: 1.55; }
      label { display: grid; gap: 8px; margin: 20px 0; color: #bcd0ee; }
      input, button { border: 1px solid #385079; border-radius: 6px; background: #0a1224; color: inherit; padding: 11px 13px; font: inherit; }
      button { width: max-content; cursor: pointer; background: #123a42; border-color: #3db6a6; }
      button:disabled { cursor: wait; opacity: .55; }
      pre { min-height: 220px; overflow: auto; padding: 16px; border: 1px solid #24385c; border-radius: 8px; background: #070d1b; line-height: 1.45; }
      .pass { color: #70e6bb; }
      .fail { color: #ff8f9f; }
    </style>
  </head>
  <body>
    <main>
      <h1>WebRTC rollback transport smoke</h1>
      <p>Development-only core harness. It creates two peers in this page, proves delayed-input rollback convergence, then suspends and reconnects one participant. The automated runner adds a separate two-context client-isolation phase.</p>
      <label>
        Local API base URL
        <input id="api-base" value="http://127.0.0.1:8789" spellcheck="false" />
      </label>
      <button id="run-smoke" type="button">Run same-page rollback smoke</button>
      <pre id="result" aria-live="polite">Idle.</pre>
    </main>
    <script type="module" src="/src/dev/webRtcBrowserSmoke.ts"></script>
  </body>
</html>
