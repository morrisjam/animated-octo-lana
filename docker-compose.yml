services:
  postgres:
    image: postgres:16-alpine
    container_name: gravity-well-postgres
    environment:
      POSTGRES_DB: gravity_well
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gravity_well"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
